[project]
name = "divcal"
version = "0.1.0"
description = "배당 지급 예정표를 월별 현금흐름 표로 접는다 (세전 · USD)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "coolbress" }]
dependencies = []

# 배포 메타데이터. 패키지를 올리지 않더라도 값을 한다 —
# `pip show` · GitHub · 의존성 그래프가 여기를 읽는다.
[project.urls]
Homepage = "https://github.com/coolbress/divcal"
Issues = "https://github.com/coolbress/divcal/issues"

# `uv run divcal <예정표.csv> <연도>` — 설치 없이도 `python -m divcal` 로 같은 것이 돈다.
[project.scripts]
divcal = "divcal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

# ── 린터·포매터 ────────────────────────────────────────────────
# 설정을 커밋한다 (바닥 MUST). CI 가 `ruff check` 와 `ruff format --check` 를 강제한다.
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 테스트에서는 assert 가 정상이다
"tests/**" = ["S101"]

# ── 타입 검사 ─────────────────────────────────────────────────
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

# ── 테스트 ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# 🔴 **조용한 실패를 막는다.** 둘 다 없으면 오타가 *아무 일도 안 하고* 통과한다 —
#   `--strict-markers`: 등록 안 된 `@pytest.mark.foo` 는 **오타여도 조용히 no-op** 이다
#   `--strict-config`  : 이 절의 키를 잘못 쓰면 **무시된다** (예: `filterwarning`)
# 검사가 도는 척하는 것이 안 도는 것보다 나쁘다.
addopts = ["--strict-markers", "--strict-config"]
# warnings-as-errors — 바닥 MUST. 경고를 쌓아두지 않는다.
# 서드파티 경고 때문에 막히면 여기에 좁은 ignore 를 한 줄씩 추가한다.
filterwarnings = ["error"]
