name: 버그
description: 뭔가 예상과 다르게 동작한다.
labels: ["bug"]
# 필드 순서는 census 순위다 (N=2,000 top-starred software · aspect 24):
# additional-context(247·1위) · steps-to-reproduce(227) · expected-behavior(210) · description(198) · version/OS · logs.
# required 는 textarea 에만 건다 — 야생 규범이 textarea 57.8% vs 체크박스 3.4% 다 (IPC-003).
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나
      description: 관찰한 것을 쓴다. 원인 추측은 아래 *더 있는 것* 으로.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 이 순서대로 하면 다시 난다.
      placeholder: |
        1. `uv run …`
        2. …
        3. 여기서 터진다
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 무엇을 기대했나
      description: "**관찰과 기대가 갈리는 지점이 버그의 정의다.**"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 버전 · 환경
      placeholder: "예: v0.1.0 · macOS 15 · Python 3.12"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 로그 · 트레이스백
      description: 있으면 붙인다. 자동으로 코드 블록이 된다.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 더 있는 것
      description: census 에서 **가장 흔한 필드**다 — 안 물으면 안 적힌다.
    validations:
      required: false
