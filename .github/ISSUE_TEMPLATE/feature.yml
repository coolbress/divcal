name: 기능 제안
description: 지금 안 되는 것을 되게 하고 싶다.
labels: ["enhancement"]
# census 순위 (aspect 24): proposed-solution(51) · alternatives-considered(48) · additional-context.
# ⚠️ 이 폼은 아이디어를 받는 자리다. 인수기준을 여기서 받지 않는다 —
# 그건 `/kickoff` 인터뷰가 `task.yml` 로 옮긴다.
body:
  - type: textarea
    id: problem
    attributes:
      label: 무엇에 막혔나
      description: 해결책이 아니라 **문제**를 쓴다. 마지막으로 그 일을 했을 때 어떻게 했는지.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 어떻게 되면 좋겠나
      description: 떠오른 방법이 있으면. 없어도 된다 — 위가 더 중요하다.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 대신 해본 것
      description: |
        **시중에 이미 있는 것도 여기 적는다.** 있는 것으로 안 되는 이유가
        이 제안의 근거가 된다 (`/kickoff` 0절과 같은 판정).
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 더 있는 것
    validations:
      required: false
