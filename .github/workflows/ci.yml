name: CI
#
# ⚠️ 잡 이름 `ci` 를 바꾸지 마라. 검사 이름이 `{호출잡}/{피호출잡}` 이 되므로
# (실측: coolbress/standards CPR-007), 이 이름이 룰셋의 required context
# `ci / lint`·`ci / typecheck`·`ci / test`·`ci / build` 와 묶여 있다.
# 바꾸면 요구된 이름이 영원히 보고되지 않아 저장소가 머지 불가로 잠긴다.
#
# CI 로직은 여기 없다 — coolbress/workflows 한 곳에 있고 @SHA 로 핀한다.
# 핀은 반드시 커밋 SHA 다 (태그는 가변 = 공급망 벡터). 옆의 주석이 그 SHA 의 버전이다 —
# 무엇이 바뀌는지는 릴리스 노트로 읽는다: github.com/coolbress/workflows/releases
# 갱신하려면 아래 SHA 를 올린다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR 에 새로 푸시하면 이전 실행을 취소한다 — 낡은 커밋에 러너를 태우지 않는다.
# main 은 취소하지 않는다: 머지된 커밋의 결과는 전부 남아야 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 🔒 **부르는 잡의 권한이 상한이다.** 재사용 워크플로가 자기 `permissions:` 를 선언해도
# 여기를 넘을 수 없다. 저장소 설정(`default_workflow_permissions`)도 read 지만 그건
# **관리자가 바꿀 수 있는 것**이고 이 줄은 **PR 로 리뷰되는 것**이다 — 층이 다르다.
# (zizmor `excessive-permissions` 가 이게 없으면 medium 으로 잡는다.)
permissions:
  contents: read

jobs:
  ci:
    uses: coolbress/workflows/.github/workflows/python-ci.yml@8dcc67a5a0d08a37859b81698fcc54dba44a6b1e # v3.8.0
