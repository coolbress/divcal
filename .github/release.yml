# 자동 생성 릴리스 노트의 분류. GitHub 은 **라벨로만** 묶는다 — 제목이 아니다.
# 라벨은 `label.yml` 이 PR 제목의 타입에서 파생시킨다. 사람이 붙이지 않는다.
#
# ⚠️ 이건 `tools/make-release.sh` 가 만드는 노트의 **아래쪽 색인**을 정리할 뿐이다.
# 위쪽의 "왜" 는 여전히 사람이 쓴다 — 소비자가 뭘 해야 하는가는 커밋 로그에 없다.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: 🚨 호출부가 고쳐야 하는 변경
      labels: [breaking]
    - title: ✨ 기능
      labels: [feat]
    - title: 🐛 고침
      labels: [fix]
    - title: 📖 문서 · 결정 · 리서치
      labels: [docs]
    - title: 🔧 CI · 빌드 · 의존성
      labels: [ci, build]
    - title: ♻️ 리팩터 · 성능 · 테스트
      labels: [refactor, perf, test, style]
    - title: 🧹 잡일
      labels: [chore, revert]
    # 🔴 catch-all 이 없으면 라벨 없는 PR 이 **조용히 사라진다.**
    # 라벨링은 벽이 아니라 편의라 실패할 수 있고, 그때 노트에서 빠지면 안 된다.
    - title: 📦 그 밖
      labels: ["*"]
